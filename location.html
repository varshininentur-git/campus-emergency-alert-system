<!DOCTYPE html>
<html>
<head>
<title>Select Location</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins', sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#141e30,#243b55);
color:white;
overflow:hidden;
}

.card{
background:rgba(255,255,255,0.08);
padding:45px;
width:420px;
height:580px;
border-radius:20px;
backdrop-filter:blur(10px);
box-shadow:0 8px 32px rgba(0,0,0,0.3);
text-align:center;
}

h1{
margin-bottom:15px;
}

.severity{
margin-bottom:25px;
font-size:16px;
}

.highlight{
color:#ffcc00;
font-weight:bold;
}

select{
width:100%;
padding:14px;
border:none;
border-radius:10px;
margin-top:20px;
margin-bottom:35px;
font-size:15px;
outline:none;
background:white;
cursor:pointer;
}

button{
margin-top:80px;
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:linear-gradient(45deg,#00b09b,#96c93d);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
box-shadow:0 10px 20px rgba(62, 37, 37, 0.3);
}

</style>
</head>

<body>

<div class="card">

<h1>📍 Select Emergency Location</h1>

<div class="severity">
Severity Selected:
<span class="highlight" id="severityText"></span>
</div>

<select id="location">

<option>H Block</option>
<option>A Block</option>
<option>D Block</option>
<option>Library</option>
<option>Canteen</option>
<option>Cricket Ground</option>
<option>Administration Office</option>

</select>

<button onclick="sendAlert()">
🚀 SEND ALERT
</button>

</div>

<script>

let severity=localStorage.getItem("severity");

document.getElementById("severityText").innerHTML=severity;

function sendAlert(){

let location=document.getElementById("location").value;

localStorage.setItem("location",location);

window.location.href="alert.html";

}

</script>

</body>
</html>
